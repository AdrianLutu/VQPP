[project]
name = "vqpp"
version = "0.1.0"
description = "VQPP: Video Query Performance Prediction Benchmark"
authors = [
    { name = "Adrian Catalin Lutu" },
    { name = "Eduard Poesina" },
    { name = "Radu Tudor Ionescu" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "torchaudio==2.3.1",
    "numpy==1.26.4",
    "decord",
    "h5py",
    "ffmpeg-python",
    "yacs",
    "toolz",
    "ipdb",
    "einops",
    "easydict",
    # 4.49.0 is the first release that supports Phi-4-mini-instruct (query reformulation).
    "transformers==4.49.0",
    "webdataset",
    "sentencepiece",
    "tqdm",
    "opencv-python",
    "audioread",
    "librosa",
    "wandb",
    "datasets",
    "huggingface_hub",
    "yt_dlp",
    "xformers==0.0.27",
    "triton==2.3.1",
    "setuptools",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "nltk==3.9.1",
    "groq==0.18.0",
    "accelerate==1.3.0",
    "peft==0.14.0",
    # finetune_phi4.py relies on the OnlineDPOTrainer API of this release (judge,
    # processing_class, and the BOS token it puts in front of every prompt).
    "trl==0.15.2"
]

[tool.poetry]
# The repository is a collection of scripts, not a package: without this, poetry install
# tries to install a package named after the project and fails to find it.
package-mode = false

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

